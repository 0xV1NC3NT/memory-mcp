[package]
name = "memory-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
iced-x86 = "1.22"
memchr = "2.8.3"
rayon = "1.12.0"
rmcp = { version = "3.11.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

[workspace]
members = [".", "testbed"]

# The test target keeps real (non-inlined) machine code for its game-like functions.
[profile.dev.package.testbed]
opt-level = 1

[profile.release]
lto = "thin"
